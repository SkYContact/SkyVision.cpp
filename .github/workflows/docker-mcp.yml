name: docker-mcp

# Builds the MCP server image on a Linux runner and smoke-tests the protocol over
# stdio. This is the same check an MCP directory (glama.ai, mcp.so, ...) runs before
# listing a server, so a green run here is the evidence they ask for.
#
# Cost control:
#   * put-commits build WITHOUT the bundled checkpoint (--build-arg MODEL_REPO=):
#     BuildKit cache mounts do not survive a fresh runner, so a bundled 400 MB
#     download would ride along on every run. The weights-less image is what the
#     initialize/tools/list smoke test needs.
#   * the full image (weights + describe_image) builds weekly and on demand.
#   * ggml is compiled in its own stage (see the Dockerfile), so the layer cache
#     already skips it; a push build only recompiles our own sources.
#     ccache can not help across runners: `RUN --mount=type=cache` never leaves the
#     builder, and `docker buildx build` has no `--mount` flag (only the Dockerfile
#     does, and its bind sources are limited to the build context / snapshotted
#     named contexts, which do not write back to the host).

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'convert/**'
      - 'tests/**'
      - '.github/workflows/docker-mcp.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'src/**'
  workflow_dispatch:
    inputs:
      bundle_model:
        description: 'build the release image (bundled SmolVLM weights + caption test)'
        type: boolean
        default: false
  schedule:
    - cron: '0 4 * * 1'   # weekly full image, so the bundled-weights path stays tested

permissions:
  contents: read
  packages: write   # registry build cache (ghcr.io); ignored if the push is denied

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build flags
        id: flags
        run: |
          echo "CACHE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/skyvision-buildcache" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ] \
             || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.bundle_model }}" = "true" ]; }; then
            echo "MODEL_REPO_ARG=SkyContact/SmolVLM-256M-GGUF" >> "$GITHUB_ENV"
            echo "bundle=true" >> "$GITHUB_OUTPUT"
            echo "bundled weights: yes"
          else
            echo "MODEL_REPO_ARG=" >> "$GITHUB_ENV"
            echo "bundle=false" >> "$GITHUB_OUTPUT"
            echo "bundled weights: no"
          fi

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      # the registry cache is an optimisation: a denied push must not fail the build
      - name: Log in to ghcr.io (build cache)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        run: |
          docker buildx build \
            --load \
            --tag skyvision-mcp:ci \
            --build-arg MODEL_REPO="${MODEL_REPO_ARG}" \
            --cache-from "type=registry,ref=${CACHE_REF}" \
            --cache-from "type=gha" \
            --cache-to "type=registry,ref=${CACHE_REF},mode=max,ignore-error=true" \
            --cache-to "type=gha,mode=min,ignore-error=true" \
            .

      - name: Image size
        run: docker images skyvision-mcp:ci --format '{{.Size}}'

      # no binary assets in the repo: build a 320x240 test picture with the stdlib
      - name: Make a test image
        run: |
          python3 - <<'PY'
          import struct, zlib
          w, h = 320, 240
          raw = bytearray()
          for y in range(h):
              raw.append(0)                                  # PNG filter: none
              for x in range(w):
                  r = 40 + x * 200 // w
                  g = 60 + y * 150 // h
                  b = 180 if (60 <= x < 260 and 40 <= y < 200) else 30
                  raw += bytes((r, g, b))

          def chunk(tag, data):
              return (struct.pack('>I', len(data)) + tag + data +
                      struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))

          png = (b'\x89PNG\r\n\x1a\n' +
                 chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) +
                 chunk(b'IDAT', zlib.compress(bytes(raw), 9)) +
                 chunk(b'IEND', b''))
          open('/tmp/smoke.png', 'wb').write(png)
          print('wrote', len(png), 'bytes')
          PY
          ls -l /tmp/smoke.png

      # 1) the "no weights at all" path every crawler hits: the server must still
      #    answer initialize / tools/list / list_models instead of failing
      - name: MCP smoke test without any models
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_models","arguments":{}}}' \
          | docker run --rm -i --entrypoint vqa-cli -v /tmp:/data:ro \
              skyvision-mcp:ci --mcp --models-dir /data/no-such-dir \
          > empty.out 2> empty.err
          echo '--- stderr'; cat empty.err
          python3 - <<'PY'
          import json
          msgs = [json.loads(l) for l in open('empty.out') if l.strip()]
          by_id = {m.get('id'): m for m in msgs}
          assert by_id[1]['result']['serverInfo']['name'] == 'skyvision', by_id[1]
          tools = [t['name'] for t in by_id[2]['result']['tools']]
          assert len(tools) >= 9, tools
          print('tools:', ', '.join(tools))
          models = json.loads(by_id[3]['result']['content'][0]['text'])['models']
          assert models == [], models
          print('empty models dir ->', models)
          PY

      # 2) the bundled SmolVLM must actually caption an image without any mounts
      #    (only in the weekly / on-demand full build: it needs the weights in the image)
      - name: MCP describe_image with the bundled model
        if: steps.flags.outputs.bundle == 'true'
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_models","arguments":{}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"describe_image","arguments":{"image":"/data/smoke.png","length":"short"}}}' \
          | docker run --rm -i -v /tmp:/data:ro skyvision-mcp:ci \
          > real.out 2> real.err
          echo '--- stderr'; tail -40 real.err
          python3 - <<'PY'
          import json
          msgs = [json.loads(l) for l in open('real.out') if l.strip()]
          by_id = {m.get('id'): m for m in msgs}
          models = json.loads(by_id[2]['result']['content'][0]['text'])['models']
          archs = {m['arch'] for m in models}
          assert 'smolvlm' in archs, archs
          print('models:', [(m['id'], m['arch']) for m in models])
          res = by_id[3]['result']
          assert not res.get('isError'), res
          text = res['content'][0]['text']
          assert len(text.strip()) > 3, repr(text)
          print('caption:', text.strip()[:160])
          PY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-smoke-logs
          path: |
            empty.out
            empty.err
            real.out
            real.err
          if-no-files-found: ignore
