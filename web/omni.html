<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__MODEL_ID__ — SkyVision.cpp Omni</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
  a.back { color: #7aa2f7; font-size: 13px; text-decoration: none; }
  h1 { font-size: 18px; margin: 10px 0 4px; word-break: break-all; }
  .sub { color: #888; font-size: 12px; margin-bottom: 20px; }
  .mediarow { display: flex; gap: 12px; margin-top: 8px; }
  .drop { flex: 1; border: 2px dashed #333a48; border-radius: 12px; padding: 20px 12px; text-align: center;
          color: #7d8798; cursor: pointer; transition: border-color .15s; font-size: 13px; }
  .drop:hover, .drop.on { border-color: #7aa2f7; }
  #preview { max-width: 100%; max-height: 260px; border-radius: 8px; margin-top: 12px; display: none; }
  audio { width: 100%; margin-top: 12px; display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  input[type=text] { flex: 1; background: #171a21; border: 1px solid #262b36; color: #e6e6e6;
                     border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  button { background: #7aa2f7; border: none; color: #0f1115; font-weight: 700; border-radius: 8px;
           padding: 10px 22px; cursor: pointer; }
  button:disabled { background: #333a48; color: #7d8798; cursor: default; }
  button.small { background: #171a21; color: #7aa2f7; border: 1px solid #262b36; font-weight: 500;
                 padding: 8px 14px; font-size: 13px; }
  button.rec { background: #e06c75; color: #0f1115; }
  label.chk { color: #888; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  #out { background: #171a21; border: 1px solid #262b36; border-radius: 10px; padding: 16px;
         margin-top: 18px; white-space: pre-wrap; font-size: 14px; line-height: 1.6; min-height: 20px; }
  #status { color: #888; font-size: 12px; margin-top: 10px; }
  #speakout { margin-top: 14px; display: none; }
  #speakout .cap { color: #888; font-size: 12px; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">&larr; 所有模型</a>
  <h1>__MODEL_ID__</h1>
  <div class="sub" id="sub">Qwen2.5-Omni · 图片 / 音频输入，文本 + 语音回答</div>

  <div class="mediarow">
    <label class="drop" id="dropImg" for="fileImg">点击或拖入图片</label>
    <label class="drop" id="dropAud" for="fileAud">点击或拖入音频（wav/mp3/m4a…）</label>
  </div>
  <img id="preview" alt="">
  <audio id="audP" controls></audio>
  <input type="file" id="fileImg" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">
  <input type="file" id="fileAud" accept="audio/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden">

  <div class="row" style="margin-top:10px">
    <button class="small" id="recBtn">麦克风录音</button>
    <button class="small" id="recStop" style="display:none">停止并发送音频</button>
    <span id="recTime" style="color:#888;font-size:12px;align-self:center"></span>
  </div>

  <div class="row">
    <input type="text" id="q" placeholder="问点什么…（音频可直接提问）" value="Describe this media.">
    <label class="chk"><input type="checkbox" id="speak" checked>语音回答</label>
    <button id="go">运行</button>
  </div>
  <div id="status"></div>
  <div id="out"></div>
  <div id="speakout">
    <div class="cap">语音回答</div>
    <audio id="replyAud" controls></audio>
  </div>
</div>
<script>
const MODEL = '__MODEL_ID__';
// what this model accepts comes from GET /api/specs - the page knows the spec
// vocabulary (inputs / speech_output), not which backend it is serving
const ARCH = '__MODEL_ARCH__';
fetch('/api/specs').then(r => r.json()).then(specs => {
  const spec = specs.find(s => s.arch === ARCH || (s.aliases || []).includes(ARCH));
  if (!spec) return;
  const sub = document.getElementById('sub');
  sub.textContent = spec.arch + ' · ' + spec.inputs.filter(i => i !== 'text').join(' / ') +
    ' 输入，文本' + (spec.speech_output ? ' + 语音' : '') + '回答';
  if (spec.note) sub.title = spec.note;
  if (!spec.speech_output) {
    document.getElementById('speak').checked = false;
    document.getElementById('speak').closest('label.chk').style.display = 'none';
  }
  if (!spec.inputs.includes('audio')) {
    const dz = document.getElementById('dropAud');
    dz.style.display = 'none';
    document.getElementById('recBtn').style.display = 'none';
    document.getElementById('dropImg').style.flex = '';
  }
  if (!spec.inputs.includes('image')) document.getElementById('dropImg').style.display = 'none';
});
// 换载在服务器后台线程执行：/load 立即返回 {"loading":true}，轮询 /status 到 ready
async function wait_model(st) {
  let r = await fetch('/api/model/' + encodeURIComponent(MODEL) + '/load', { method: 'POST' });
  let j = await r.json().catch(() => ({}));
  if (j.loading) {
    for (;;) {
      await new Promise(res => setTimeout(res, 800));
      r = await fetch('/api/model/' + encodeURIComponent(MODEL) + '/status');
      j = await r.json();
      if (j.state === 'ready') return;
      if (j.state === 'error') throw new Error(j.error || 'load failed');
      if (st && j.bytes_total)
        st.textContent = '切换模型 ' + (100 * j.bytes_done / j.bytes_total).toFixed(0) +
                         '%（' + (j.elapsed_ms / 1000).toFixed(0) + ' s）…';
    }
  }
  if (!r.ok) throw new Error(j.error || 'load failed');
}
const dropImg = document.getElementById('dropImg'), fileImg = document.getElementById('fileImg');
const dropAud = document.getElementById('dropAud'), fileAud = document.getElementById('fileAud');
const imgP = document.getElementById('preview'), audP = document.getElementById('audP');
let blob = null, kind = '';   // '' | 'image' | 'audio'

function take(f, isAudio) {
  if (!f) return;
  blob = f;
  kind = isAudio ? 'audio' : 'image';
  dropImg.textContent = isAudio ? '点击或拖入图片' : f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB) — 点击替换';
  dropAud.textContent = isAudio ? f.name + ' (' + (f.size / 1048576).toFixed(1) + ' MB) — 点击替换' : '点击或拖入音频（wav/mp3/m4a…）';
  imgP.style.display = 'none'; audP.style.display = 'none';
  const url = URL.createObjectURL(f);
  if (isAudio) { audP.src = url; audP.style.display = 'block'; }
  else { imgP.src = url; imgP.style.display = 'block'; }
}
dropImg.ondragover = e => { e.preventDefault(); dropImg.classList.add('on'); };
dropImg.ondragleave = () => dropImg.classList.remove('on');
dropImg.ondrop = e => { e.preventDefault(); dropImg.classList.remove('on'); take(e.dataTransfer.files[0], false); };
dropAud.ondragover = e => { e.preventDefault(); dropAud.classList.add('on'); };
dropAud.ondragleave = () => dropAud.classList.remove('on');
dropAud.ondrop = e => { e.preventDefault(); dropAud.classList.remove('on'); take(e.dataTransfer.files[0], true); };
fileImg.onchange = () => take(fileImg.files[0], false);
fileAud.onchange = () => take(fileAud.files[0], true);

// --- optional microphone capture (MediaRecorder) ---------------------------
const recBtn = document.getElementById('recBtn'), recStop = document.getElementById('recStop');
const recTime = document.getElementById('recTime');
let recorder = null, recT0 = 0, recTimer = null;
recBtn.onclick = async () => {
  if (!navigator.mediaDevices || !window.MediaRecorder) { recTime.textContent = '浏览器不支持录音'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    const parts = [];
    recorder.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      take(new Blob(parts, { type: recorder.mimeType || 'audio/webm' }), true);
    };
    recorder.start();
    recT0 = Date.now();
    recTimer = setInterval(() => { recTime.textContent = ((Date.now() - recT0) / 1000).toFixed(0) + ' s'; }, 500);
    recBtn.style.display = 'none'; recStop.style.display = ''; recTime.textContent = '0 s';
  } catch (e) { recTime.textContent = '无法访问麦克风：' + e.message; }
};
recStop.onclick = () => {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  clearInterval(recTimer);
  recBtn.style.display = ''; recStop.style.display = 'none';
};

// --- ask --------------------------------------------------------------------
const btn = document.getElementById('go'), out = document.getElementById('out'),
      status = document.getElementById('status'), speakout = document.getElementById('speakout'),
      replyAud = document.getElementById('replyAud');
btn.onclick = async () => {
  if (!blob && !document.getElementById('q').value) return;
  btn.disabled = true;
  out.textContent = '';
  speakout.style.display = 'none'; replyAud.removeAttribute('src');
  const t0 = performance.now();
  status.textContent = '加载模型（首次约 30 秒）…';
  try {
    await wait_model(status);
    status.textContent = '多模态编码…';
    const q = encodeURIComponent(document.getElementById('q').value);
    const k = kind === 'audio' ? '&kind=audio' : '';
    const sp = document.getElementById('speak').checked ? '&speak=1' : '';
    const r = await fetch('/api/model/' + encodeURIComponent(MODEL) + '/ask?q=' + q + k + sp + '&n=300&stream=1', {
      method: 'POST', body: blob || new Uint8Array(0)
    });
    // NDJSON: {"phase":"vision"} {"t":".."}* then {"wav":"<b64>","done":true}
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '', t0v = 0, nt = 0;
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.error) throw new Error(ev.error);
        if (ev.stage) { status.textContent = '编码 ' + ev.done + '/' + ev.total + '…'; continue; }
        if (ev.phase) { t0v = performance.now(); continue; }
        if (ev.t) {
          if (!nt) { status.textContent = '生成中…'; t0v = performance.now(); }
          text += ev.t; nt++;
          out.textContent = text;
        }
        if (ev.done) {
          if (ev.wav) {   // base64 -> blob -> <audio>
            const bstr = atob(ev.wav), bytes = new Uint8Array(bstr.length);
            for (let i = 0; i < bstr.length; i++) bytes[i] = bstr.charCodeAt(i);
            replyAud.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
            speakout.style.display = 'block';
            replyAud.play().catch(() => {});
          }
          const tv = ((performance.now() - t0v) / 1000).toFixed(1);
          status.textContent = '完成，' + nt + ' token / ' + tv + ' s' +
                               (nt > 5 ? '（' + (nt / tv).toFixed(1) + ' tok/s）' : '');
        }
      }
    }
    if (!text && !status.textContent.startsWith('完成')) throw new Error('empty response');
  } catch (e) {
    out.textContent = '错误：' + e.message;
    status.textContent = '';
  }
  btn.disabled = false;
};
</script>
</body>
</html>
