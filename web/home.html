<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyVision.cpp — 模型</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; background: #0f1115; color: #e6e6e6; margin: 0; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 24px; }
  h1 { font-size: 22px; font-weight: 600; }
  h1 span { color: #7aa2f7; }
  .sub { color: #888; font-size: 13px; margin-bottom: 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: #171a21; border: 1px solid #262b36; border-radius: 12px; padding: 18px 20px;
          cursor: pointer; transition: border-color .15s, transform .15s; text-decoration: none; color: inherit; display: block; }
  .card:hover { border-color: #7aa2f7; transform: translateY(-2px); }
  .arch { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7aa2f7; font-weight: 700; }
  .name { font-size: 16px; font-weight: 600; margin: 6px 0 10px; word-break: break-all; }
  .meta { font-size: 12px; color: #888; }
  .meta b { color: #b9c2d0; font-weight: 600; }
  .empty { color: #666; margin-top: 30px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sky<span>Vision</span>.cpp</h1>
  <div class="sub">本地多模型视觉推理 · 只显示可运行的模型</div>
  <div class="sub" id="loadbanner" style="display:none;color:#e0af68"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    没有发现可运行的模型。把 *.gguf（及 moondream 的 *-vision.gguf、tokenizer.json）放到启动目录后刷新。
  </div>
</div>
<script>
// capability text comes from GET /api/specs (the fixed task vocabulary) - no
// per-backend knowledge lives here; unknown arch falls back to the arch label
const TASK_LABEL = { ask: '问答', caption: '描述', detect: '检测', point: '定位',
                     gaze: '注视', classify: '分类', embed: '向量', score: '打分', gate: '门控' };
const INPUT_LABEL = { image: '图像', video: '视频', audio: '音频', text: '文本' };
const specByArch = {};   // every canonical label + alias -> spec entry
fetch('/api/specs')
  .then(r => r.json())
  .then(specs => { for (const s of specs) {
      specByArch[s.arch] = s;
      for (const a of s.aliases || []) specByArch[a] = s;
  } })
  .catch(() => {})       // spec endpoint down -> fall back to raw arch labels
  .finally(() => fetch('/api/models').then(r => r.json()).then(d => {
  const grid = document.getElementById('grid');
  if (!d.models.length) { document.getElementById('empty').style.display = 'block'; return; }
  for (const m of d.models) {
    const gb = (m.size / 1073741824).toFixed(1);
    const s = specByArch[m.arch];
    const cap = s
      ? s.tasks.map(t => TASK_LABEL[t] || t).join(' / ') + ' · ' +
        s.inputs.filter(i => i !== 'text').map(i => INPUT_LABEL[i] || i).join(' + ')
      : m.arch;
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/model/' + encodeURIComponent(m.id);
    a.innerHTML = `<div class="arch">${m.arch}</div>
      <div class="name">${m.id}</div>
      <div class="meta"><b>${gb} GB</b> · ${m.quant} · ${cap}</div>`;
    grid.appendChild(a);
  }
  }));
// 后台换载提示：有模型在加载时轮询 /status 显示进度（切换期间提问返回 409）
setInterval(async () => {
  const el = document.getElementById('loadbanner');
  const d = await fetch('/api/models').then(r => r.json()).catch(() => null);
  if (!d || !d.loading_id) { el.style.display = 'none'; return; }
  const s = await fetch('/api/model/' + encodeURIComponent(d.loading_id) + '/status')
              .then(r => r.json()).catch(() => null);
  const pct = s && s.bytes_total ? ' ' + (100 * s.bytes_done / s.bytes_total).toFixed(0) + '%' : '';
  el.textContent = '模型 ' + d.loading_id + ' 正在后台加载' + pct + '（切换期间提问会被暂时拒绝）…';
  el.style.display = 'block';
}, 2000);
</script>
</body>
</html>
