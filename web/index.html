<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>moondream.cpp — 图像识别</title>
<style>
 *{box-sizing:border-box}
 body{font-family:system-ui,"Segoe UI",sans-serif;background:#0f1115;color:#e6e6e6;margin:0}
 header{padding:14px 20px;border-bottom:1px solid #1d222c;display:flex;align-items:center;gap:10px}
 header h1{font-size:16px;font-weight:600;color:#9fc3ff;margin:0}
 header .tag{font-size:11px;color:#5b6472;border:1px solid #2c3442;border-radius:20px;padding:2px 10px}
 main{display:flex;gap:16px;padding:16px;max-width:1200px;margin:0 auto;min-height:calc(100vh - 60px)}
 #stage{flex:1.4;position:relative;border:2px dashed #2c3442;border-radius:12px;display:flex;
        align-items:center;justify-content:center;cursor:pointer;min-height:420px;overflow:hidden;background:#12151c}
 #stage.drag{border-color:#9fc3ff;background:#141b26}
 #stage img{max-width:100%;max-height:78vh;display:none}
 #stage canvas{position:absolute;display:none}
 #dropmsg{color:#5b6472;font-size:14px;text-align:center;pointer-events:none}
 #dropmsg b{color:#9fc3ff}
 #panel{flex:1;display:flex;flex-direction:column;gap:14px;min-width:300px}
 .card{background:#161a22;border:1px solid #1d222c;border-radius:10px;padding:12px}
 .card h2{font-size:12px;color:#8a93a3;margin:0 0 8px;font-weight:600;letter-spacing:.5px}
 .row{display:flex;gap:8px}
 button{background:#2b4a7a;color:#fff;border:0;border-radius:7px;padding:8px 12px;cursor:pointer;font-size:13px;flex:1}
 button:hover{background:#365b93}
 button.sec{background:#262c37}
 button.sec:hover{background:#303845}
 button:disabled{opacity:.35;cursor:default}
 input[type=text]{flex:1;background:#10141b;border:1px solid #2c3442;color:#e6e6e6;border-radius:7px;
        padding:8px 10px;font-size:13px;outline:none}
 input[type=text]:focus{border-color:#3d5a80}
 #status{font-size:12px;color:#5b6472;min-height:16px}
 #results{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto}
 .res{background:#10141b;border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.55;white-space:pre-wrap}
 .res .kind{font-size:10px;color:#9fc3ff;letter-spacing:1px;display:block;margin-bottom:4px}
 .res.err{color:#ff8f8f}
 .dot{display:inline-block;width:7px;height:7px;background:#9fc3ff;border-radius:50%;margin-right:6px;
      animation:p 1s infinite alternate}
 @keyframes p{to{opacity:.2}}
 #boxes-info{font-size:12px;color:#7ce0a8;margin-top:6px;display:none}
</style>
</head>
<body>
<header>
 <h1>moondream.cpp</h1><span class="tag">local VLM · 图像识别</span>
 <span id="status" style="margin-left:auto"></span>
</header>
<main>
 <div id="stage">
   <div id="dropmsg">点击选择图片，或把图片<b>拖拽 / Ctrl+V 粘贴</b>到这里</div>
   <img id="img"><canvas id="cv"></canvas>
 </div>
 <div id="panel">
   <div class="card">
     <h2>图像描述</h2>
     <div class="row">
       <button id="b-short" class="sec" onclick="caption('short')">简短</button>
       <button id="b-normal" onclick="caption('normal')">标准</button>
       <button id="b-long" class="sec" onclick="caption('long')">详细</button>
     </div>
     <div id="boxes-info"></div>
   </div>
   <div class="card">
     <h2>提问</h2>
     <div class="row">
       <input type="text" id="q" placeholder="图里有什么？数量？颜色？…" autocomplete="off">
       <button onclick="ask()">问</button>
     </div>
   </div>
   <div class="card">
     <h2>目标检测 / 定位</h2>
     <div class="row">
       <input type="text" id="obj" placeholder="目标，如 red car" autocomplete="off">
       <button onclick="detect()">框选</button>
       <button class="sec" onclick="point()">定位</button>
     </div>
   </div>
   <div class="card">
     <h2>注视点预测</h2>
     <div class="row">
       <span id="gaze-pt" style="flex:1;font-size:12px;color:#5b6472;align-self:center">点「选起点」后在图上点击眼睛/人脸</span>
       <button class="sec" onclick="gazeArm(this)">选起点</button>
       <button onclick="gaze()">预测注视点</button>
     </div>
   </div>
   <div class="card" style="flex:1">
     <h2>结果</h2>
     <div id="results"><div class="res" style="color:#5b6472">先放一张图进来吧</div></div>
   </div>
 </div>
</main>
<input type="file" id="file" accept="image/*" style="display:none">
<script>
let imgBytes=null;
const stage=document.getElementById('stage'), img=document.getElementById('img'),
      cv=document.getElementById('cv'), statusEl=document.getElementById('status'),
      results=document.getElementById('results'), boxesInfo=document.getElementById('boxes-info');

function setStatus(t,busy){statusEl.innerHTML=busy?'<span class="dot"></span>'+t:t;}
function addResult(kind,text,err){
 const d=document.createElement('div');d.className='res'+(err?' err':'');
 d.innerHTML='<span class="kind">'+kind+'</span>';d.appendChild(document.createTextNode(text));
 results.prepend(d);return d;}
function setBusy(b){document.querySelectorAll('button').forEach(x=>x.disabled=b);
 document.querySelectorAll('.card input').forEach(x=>x.disabled=b);}
function clearBoxes(){cv.getContext('2d').clearRect(0,0,cv.width,cv.height);boxesInfo.style.display='none';}

function loadImage(f){
 if(!f||!f.type.startsWith('image/'))return;
 const rd=new FileReader();
 rd.onload=()=>{ setImage(new Uint8Array(rd.result)); };
 rd.readAsArrayBuffer(f);
}
function setImage(bytes){
 imgBytes=bytes;
 const url=URL.createObjectURL(new Blob([bytes]));
 img.onload=()=>{layoutCanvas();clearBoxes();};
 img.src=url;img.style.display='block';cv.style.display='block';
 document.getElementById('dropmsg').style.display='none';
 results.innerHTML='';setStatus('图片已加载 '+img.naturalWidth+'×'+img.naturalHeight);
}
function layoutCanvas(){cv.width=img.naturalWidth;cv.height=img.naturalHeight;}

stage.onclick=e=>{
 if(gazeArmed&&imgBytes){   // gaze source-point pick mode
   const ir=img.getBoundingClientRect();
   const x=(e.clientX-ir.left)/ir.width, y=(e.clientY-ir.top)/ir.height;
   if(x<0||x>1||y<0||y>1)return;
   gazeSrc={x,y};
   gazeArmed=false;
   document.querySelectorAll('button').forEach(b=>{if(b.textContent.startsWith('选起点'))b.textContent='选起点';});
   document.getElementById('gaze-pt').textContent=
     '起点 ('+x.toFixed(3)+', '+y.toFixed(3)+')，点「预测注视点」';
   clearBoxes();drawGazeMark(x,y,'#9fc3ff');
   return;
 }
 document.getElementById('file').click();
};
document.getElementById('file').onchange=e=>{loadImage(e.target.files[0]);e.target.value='';};
stage.ondragover=e=>{e.preventDefault();stage.classList.add('drag');};
stage.ondragleave=()=>stage.classList.remove('drag');
stage.ondrop=e=>{e.preventDefault();stage.classList.remove('drag');
 const f=e.dataTransfer.files[0];if(f)loadImage(f);
 const it=e.dataTransfer.items||[];
 for(const i of it)if(i.type.startsWith('image/')){i.getAsString(()=>{});}
};
document.onpaste=e=>{
 for(const it of e.clipboardData.items)
   if(it.type.startsWith('image/')){loadImage(it.getAsFile());break;}
};

function needImage(){if(!imgBytes){addResult('提示','先放一张图片',true);return false;}return true;}
async function callVision(params){
 const r=await fetch('/api/vision?'+params,{method:'POST',body:imgBytes});
 if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);
 return r.json();
}

async function caption(len){
 if(!needImage())return;
 const d=addResult('描述 · '+len,'…');setBusy(true);setStatus('生成描述…',true);clearBoxes();
 try{const j=await callVision('mode=caption&len='+len);d.textContent=j.text;}
 catch(e){d.textContent='错误: '+e.message;d.classList.add('err');}
 setBusy(false);setStatus('');
}
async function ask(){
 const q=document.getElementById('q');const t=q.value.trim();if(!t)return;
 q.value='';
 if(!needImage()){addResult('提问',t);return;}
 const d=addResult('提问 · '+t,'…');setBusy(true);setStatus('分析中…',true);clearBoxes();
 try{const j=await callVision('mode=ask&q='+encodeURIComponent(t));d.textContent=j.text;}
 catch(e){d.textContent='错误: '+e.message;d.classList.add('err');}
 setBusy(false);setStatus('');
}
async function detect(){
 const o=document.getElementById('obj');const t=o.value.trim();if(!t)return;
 o.value='';
 if(!needImage()){addResult('检测',t);return;}
 const d=addResult('检测 · '+t,'…');setBusy(true);setStatus('检测中…',true);clearBoxes();
 try{
   const j=await callVision('mode=detect&q='+encodeURIComponent(t));
   const boxes=j.boxes||[];
   if(boxes.length){
     layoutCanvas();const c=cv.getContext('2d');
     c.lineWidth=Math.max(2,cv.width/220);c.strokeStyle='#38ff9c';
     boxes.forEach(b=>c.strokeRect(b[0]*cv.width,b[1]*cv.height,(b[2]-b[0])*cv.width,(b[3]-b[1])*cv.height));
     d.textContent='找到 '+boxes.length+' 个「'+t+'」，已框出';
     boxesInfo.style.display='block';boxesInfo.textContent='绿框 = '+t+' × '+boxes.length;
   }else d.textContent='没有找到「'+t+'」';
 }catch(e){d.textContent='错误: '+e.message;d.classList.add('err');}
 setBusy(false);setStatus('');
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask();});
document.getElementById('obj').addEventListener('keydown',e=>{if(e.key==='Enter')detect();});

// ---- point ----
async function point(){
 const o=document.getElementById('obj');const t=o.value.trim();if(!t)return;
 o.value='';
 if(!needImage()){addResult('定位',t);return;}
 const d=addResult('定位 · '+t,'…');setBusy(true);setStatus('定位中…',true);clearBoxes();
 try{
   const j=await callVision('mode=point&q='+encodeURIComponent(t));
   const pts=j.points||[];
   if(pts.length){
     layoutCanvas();const c=cv.getContext('2d');
     c.lineWidth=Math.max(2,cv.width/220);c.strokeStyle='#ffd23f';
     pts.forEach(p=>{
       const px=p[0]*cv.width,py=p[1]*cv.height,r=Math.max(6,cv.width/80);
       c.beginPath();c.arc(px,py,r,0,7);c.stroke();
       c.beginPath();c.moveTo(px-r*1.6,py);c.lineTo(px+r*1.6,py);
       c.moveTo(px,py-r*1.6);c.lineTo(px,py+r*1.6);c.stroke();
     });
     d.textContent='定位到 '+pts.length+' 个「'+t+'」（黄色十字）';
   }else d.textContent='没有定位到「'+t+'」';
 }catch(e){d.textContent='错误: '+e.message;d.classList.add('err');}
 setBusy(false);setStatus('');
}

// ---- gaze ----
let gazeSrc=null, gazeArmed=false;
function gazeArm(btn){
 gazeArmed=!gazeArmed;
 btn.textContent=gazeArmed?'选起点 ✓（点图）':'选起点';
 document.getElementById('gaze-pt').textContent=gazeArmed?'现在在图上点击眼睛/人脸':'点「选起点」后在图上点击眼睛/人脸';
}
function drawGazeMark(x,y,color){
 layoutCanvas();const c=cv.getContext('2d');
 c.lineWidth=Math.max(2,cv.width/220);c.strokeStyle=color;
 const px=x*cv.width,py=y*cv.height,r=Math.max(7,cv.width/70);
 c.beginPath();c.arc(px,py,r,0,7);c.stroke();
 c.beginPath();c.moveTo(px-r*1.5,py);c.lineTo(px+r*1.5,py);
 c.moveTo(px,py-r*1.5);c.lineTo(px,py+r*1.5);c.stroke();
}
async function gaze(){
 if(!needImage())return;
 if(!gazeSrc){addResult('提示','先在图上点击一个起点（眼睛/人脸）',true);return;}
 const d=addResult('注视 · ('+gazeSrc.x.toFixed(2)+','+gazeSrc.y.toFixed(2)+')','…');
 setBusy(true);setStatus('预测注视点…',true);clearBoxes();
 drawGazeMark(gazeSrc.x,gazeSrc.y,'#9fc3ff');
 try{
   const j=await callVision('mode=gaze&x='+gazeSrc.x+'&y='+gazeSrc.y);
   if(j.x==null){d.textContent='该点没有检测到注视（模型返回空）';}
   else{
     drawGazeMark(j.x,j.y,'#38ff9c');
     d.textContent='注视点 ≈ ('+j.x.toFixed(3)+', '+j.y.toFixed(3)+')，绿十字已标出';
   }
 }catch(e){d.textContent='错误: '+e.message;d.classList.add('err');}
 setBusy(false);setStatus('');
}
</script>
</body>
</html>
